name: archnext
region: nyc
services:
  - name: backend
    github:
      branch: main
      deploy_on_push: true
      repo: swappy999/test
    source_dir: backend
    dockerfile_path: Dockerfile
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${archnext-db.DATABASE_URL}
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
  - name: frontend
    github:
      branch: main
      deploy_on_push: true
      repo: swappy999/test
    source_dir: frontend
    dockerfile_path: Dockerfile
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${backend.PUBLIC_URL}
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
databases:
  - engine: PG
    name: archnext-db
    production: false
    version: "15"
